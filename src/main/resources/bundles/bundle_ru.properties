allyfade.settings=Ally Fade
allyfade.settings.description=Делает союзных летающих юнитов полупрозрачными, когда они перекрывают центральную область обзора камеры. Меняется только отображение: характеристики, здоровье и команды юнитов не затрагиваются.

setting.allyfade-enabled.name=Включить Ally Fade
setting.allyfade-enabled.description=Включает или выключает эффект прозрачности.

setting.allyfade-opacity.name=Минимальная непрозрачность
setting.allyfade-opacity.description=Непрозрачность юнита в самом центре обзора. По умолчанию 25%; 0% делает юнитов невидимыми в центре, 100% отключает эффект.

setting.allyfade-central-zone.name=Размер центральной зоны
setting.allyfade-central-zone.description=Радиус полностью прозрачной центральной зоны в процентах от меньшей стороны обзора. По умолчанию: 4%.

setting.allyfade-transition-zone.name=Размер переходной зоны
setting.allyfade-transition-zone.description=Ширина плавного перехода после центральной зоны в процентах от меньшей стороны обзора. Полная непрозрачность начинается на сумме центральной и переходной зон. По умолчанию: 16% (полное восстановление на 20%).

setting.allyfade-smoothness.name=Плавность перехода
setting.allyfade-smoothness.description=Форма кривой перехода. 0% — линейно, 50% — классический smoothstep, 100% — максимально плавно.

setting.allyfade-size-aware.name=Учитывать размеры юнитов
setting.allyfade-size-aware.description=Крупные юниты начинают становиться прозрачными раньше, так как их спрайты перекрывают центральную зону с большего расстояния.

setting.allyfade-keep-player-opaque.name=Не делать прозрачным юнита игрока
setting.allyfade-keep-player-opaque.description=Юнит, которым вы управляете напрямую, всегда остаётся полностью непрозрачным, даже в центре обзора. Отключите, если хотите, чтобы ваш летающий юнит тоже становился прозрачным.
