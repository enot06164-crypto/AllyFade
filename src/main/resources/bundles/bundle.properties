allyfade.settings=Ally Fade
allyfade.settings.description=Fades allied flying units that overlap the center of the camera view. Only visuals are changed; gameplay, health and commands are untouched.

setting.allyfade-enabled.name=Enable Ally Fade
setting.allyfade-enabled.description=Turns the fading effect on or off.

setting.allyfade-opacity.name=Minimum opacity
setting.allyfade-opacity.description=Opacity of a unit in the very center of the view. 25% is the default; 0% makes units invisible there, 100% disables fading.

setting.allyfade-central-zone.name=Central zone size
setting.allyfade-central-zone.description=Radius of the fully faded central zone, as a percentage of the smaller side of the view. Default: 4%.

setting.allyfade-transition-zone.name=Transition zone size
setting.allyfade-transition-zone.description=Width of the smooth transition beyond the central zone, as a percentage of the smaller side of the view. Full opacity begins at central + transition. Default: 16% (fade ends at 20%).

setting.allyfade-smoothness.name=Transition smoothness
setting.allyfade-smoothness.description=Shape of the fade curve. 0% is linear, 50% is classic smoothstep, 100% is extra smooth.

setting.allyfade-size-aware.name=Account for unit size
setting.allyfade-size-aware.description=Starts fading larger units earlier, because their sprites cover the central zone from farther away.

setting.allyfade-keep-player-opaque.name=Keep the controlled unit opaque
setting.allyfade-keep-player-opaque.description=The unit you are directly controlling always stays fully opaque, even in the center of the view. Turn this off to fade your own flying unit as well.
